<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Lista de Posts</title>
</head>

<body>
    <h1>Posts do Blog</h1>

    {% for post in posts %}
    <h2>
        <a href="{% url 'post_detail' post.pk %}">
            {{ post }}
        </a>
    </h2>
    {% empty %}
    <p>Nenhum post encontrado.</p>
    {% endfor %}
</body>

</html>
