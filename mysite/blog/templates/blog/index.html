{% extends "blog/base.html" %}

{% block title %}Página Inicial - Meu Blog{% endblock %}

{% block content %}
<h2>Posts do Blog</h2>

{% for post in posts %}
<article>
    <h3>
        <a href="{% url 'post_detail' post.pk %}">
            {{ post }}
        </a>
    </h3>
</article>
{% empty %}
<p>Nenhum post encontrado.</p>
{% endfor %}
{% endblock %}
