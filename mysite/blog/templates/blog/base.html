{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Meu Blog{% endblock %}</title>
</head>

<body>
    <header>
        <h1>Meu Blog Django</h1>

        <nav>
            <a href="{% url 'post_list' %}">Início</a>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>Blog desenvolvido com Django - EBAC</p>
    </footer>
</body>

</html>
